name: Verify StickLab
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check browser source syntax
        run: |
          node --check src/core.js
          node --check src/game.js
      - name: Build hosted and portable games
        run: node scripts/build-offline.cjs
      - name: Run physics, compatibility and build tests
        run: node --test tests/*.test.cjs
      - name: Confirm deterministic generated files
        run: git diff --exit-code -- index.html StickLab-Offline.html
